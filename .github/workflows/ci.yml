name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sur main, seule la branche dev est autorisée à être mergée
  check-source:
    name: Check source branch
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only dev -> main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Seule la branche dev peut être mergée dans main (source: $HEAD_REF)"
            exit 1
          fi

    format:
      name: Format check (clang-format)
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
        - uses: actions/checkout@v4
          with:
            ref: ${{ github.head_ref }}
            token: ${{ secrets.PR_TOKEN }}

        - name: Install clang-format
          run: sudo apt-get update && sudo apt-get install -y clang-format

        - name: List C++ files
          run: |
            find . -regex '.*\.\(cpp\|h\|hpp\|cc\)$' \
              -not -path "./build/*" \
              -not -path "*/JUCE/*" \
              -not -path "*/modules/*" \
              -not -path "*/libs/*" > files.txt
            echo "Found $(wc -l < files.txt) files"

        - name: Auto-fix formatting
          run: |
            if [ -s files.txt ]; then
              xargs -a files.txt -d '\n' clang-format -i
            fi

        - name: Commit fixes if any
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --staged --quiet || git commit -m "style: auto-fix clang-format"
            git push origin HEAD:${{ github.head_ref }} || true

        - name: Report remaining issues (non-blocking)
          continue-on-error: true
          run: |
            if [ -s files.txt ]; then
              xargs -a files.txt -d '\n' clang-format --dry-run --Werror
            fi
            