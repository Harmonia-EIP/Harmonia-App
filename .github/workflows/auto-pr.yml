name: Auto PR to dev

on:
  push:
    branches-ignore:
      - main
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR to dev automatically
        env:
          # PAT dédié (Contents: RW, Pull requests: RW) — pas GITHUB_TOKEN,
          # sinon les checks ne se déclenchent pas sur la PR créée.
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          count=$(gh pr list --head "$GITHUB_REF_NAME" --base dev --state open --json number --jq 'length')
          if [ "$count" = "0" ]; then
            gh pr create \
              --base dev \
              --head "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --body "PR ouverte automatiquement depuis \`$GITHUB_REF_NAME\`." \
              --assignee "$GITHUB_ACTOR"
          else
            echo "Une PR existe déjà pour $GITHUB_REF_NAME"
          fi
