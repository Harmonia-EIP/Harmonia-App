name: Build & Deploy Harmonia

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-plugin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          cmake --fresh -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build
        run: cmake --build build --clean-first

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harmonia-VST3
          path: build/Harmonia_artefacts/Release/VST3/

      - name: Upload Standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harmonia-Standalone
          path: build/Harmonia_artefacts/Release/Standalone/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download VST3 artifact
        uses: actions/download-artifact@v4
        with:
          name: Harmonia-VST3
          path: release/vst3

      - name: Download Standalone artifact
        uses: actions/download-artifact@v4
        with:
          name: Harmonia-Standalone
          path: release/standalone

      - name: Check files
        run: |
          ls -R release/vst3
          ls -R release/standalone
          test -d release/vst3/Harmonia.vst3 || (echo "VST3 bundle manquant!" && exit 1)
          test -f release/standalone/Harmonia.exe || (echo "Standalone exe manquant!" && exit 1)

      - name: Create ZIPs
        run: |
          cd release/vst3
          zip -r ../../Harmonia.vst3.zip Harmonia.vst3
          cd ../standalone
          zip -r ../../Harmonia.exe.zip Harmonia.exe
          cd ../..
          echo "VST3_SHA=$(sha256sum Harmonia.vst3.zip | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "EXE_SHA=$(sha256sum Harmonia.exe.zip | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Upload ZIPs (temp)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "Harmonia.vst3.zip,Harmonia.exe.zip"
          target: "/var/www/harmonia-downloads/tmp/"
          overwrite: true

      - name: Replace ZIPs atomically
        uses: appleboy/ssh-action@v1.0.3
        env:
          VST3_SHA: ${{ env.VST3_SHA }}
          EXE_SHA: ${{ env.EXE_SHA }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VST3_SHA,EXE_SHA
          script_stop: true
          script: |
            cd /var/www/harmonia-downloads

            echo "--- tmp avant remplacement ---"
            ls -l --time-style=full-iso tmp/

            mv -f tmp/Harmonia.vst3.zip Harmonia.vst3.zip
            mv -f tmp/Harmonia.exe.zip Harmonia.exe.zip

            echo "--- dossier final ---"
            ls -l --time-style=full-iso

            echo "$VST3_SHA  Harmonia.vst3.zip" | sha256sum -c -
            echo "$EXE_SHA  Harmonia.exe.zip" | sha256sum -c -