name: Build & Deploy Harmonia

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-plugin
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harmonia-VST3
          path: build/HarmoniaPlugin_artefacts/Release/VST3/

      - name: Upload Standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harmonia-Standalone
          path: build/HarmoniaPlugin_artefacts/Release/Standalone/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download VST3 artifact
        uses: actions/download-artifact@v4
        with:
          name: Harmonia-VST3
          path: release/vst3

      - name: Download Standalone artifact
        uses: actions/download-artifact@v4
        with:
          name: Harmonia-Standalone
          path: release/standalone

      - name: Check files
        run: |
          ls -R release/vst3
          ls -R release/standalone
          test -d release/vst3/HarmoniaPlugin.vst3 || (echo "VST3 bundle manquant!" && exit 1)
          test -f release/standalone/HarmoniaPlugin.exe || (echo "Standalone exe manquant!" && exit 1)

      - name: Create ZIPs
        run: |
          cd release/vst3
          zip -r ../../HarmoniaPlugin.vst3.zip HarmoniaPlugin.vst3
          cd ../standalone
          zip -r ../../HarmoniaPlugin.exe.zip HarmoniaPlugin.exe

      - name: Upload ZIPs (temp)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "HarmoniaPlugin.vst3.zip,HarmoniaPlugin.exe.zip"
          target: "/var/www/harmonia-downloads/tmp/"

      - name: Replace ZIPs atomically
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mv /var/www/harmonia-downloads/tmp/HarmoniaPlugin.vst3.zip \
               /var/www/harmonia-downloads/HarmoniaPlugin.vst3.zip
            mv /var/www/harmonia-downloads/tmp/HarmoniaPlugin.exe.zip \
               /var/www/harmonia-downloads/HarmoniaPlugin.exe.zip